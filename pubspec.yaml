name: galaxy_defender
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flame: ^1.38.2
  flame_bloc: ^1.12.24
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4
  icons_flutter: ^1.0.0
  ultimate_flutter_icons: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide-Regular.ttf

assets:
  assets/fonts/
  asset/levels/
